[package]
name = "lr2021-test"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

# Keep the embedded experiment independent from the host flight-computer workspace.
[workspace]

[features]
default = []
tx = []

[target.'cfg(target_os = "none")'.dependencies]
lr2021 = { path = "vendor/lr2021", features = ["defmt"] }
embassy-nrf = { version = "=0.11.0", features = ["defmt", "nrf54l15-app-s", "time-driver-grtc", "gpiote", "time"] }
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embedded-hal = "1"
embedded-hal-async = "1"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"

[profile.release]
debug = 2
