[package]
name = "lr2021-test"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

# Keep this embedded experiment independent from the host workspace.
[workspace]

[features]
default = []
tx = []

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = { version = "0.7", features = [
  "inline-asm",
  "critical-section-single-core",
] }
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
embassy-executor = { version = "=0.10.0", features = [
  "defmt",
  "executor-thread",
  "platform-cortex-m",
] }
embassy-nrf = { version = "=0.11.0", features = [
  "defmt",
  "gpiote",
  "nrf54l15-app-s",
  "time",
  "time-driver-grtc",
] }
embassy-time = { version = "0.5", features = [
  "defmt",
  "defmt-timestamp-uptime",
] }
embedded-hal = "1"
embedded-hal-async = "1"
lr2021 = { path = "vendor/lr2021", features = ["defmt"] }
panic-probe = { version = "1", features = ["print-defmt"] }

[profile.release]
debug = 2
