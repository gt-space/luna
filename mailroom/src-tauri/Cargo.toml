[package]
name = "mailroom"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
csv = "1.3"
postcard-log = { path = "../../utility/postcard-log" }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "net", "sync", "time"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev.package.postcard-log]
opt-level = 2

[profile.dev.package.common]
opt-level = 2

[profile.dev.package.serde_json]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
