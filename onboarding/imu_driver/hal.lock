# Pinned STM32 HAL sources for this project.
#
# CubeMX generated this project against STM32Cube FW_F0 V1.11.6. Rather than
# committing the ~3.7 MB of vendor code it copied into Drivers/, the tree is
# reconstructed by fetch-hal.sh from the exact upstream commits that release
# was built from. Commit SHAs are git content hashes, so they cannot be moved
# the way a tag can.
#
# To move to a newer HAL: bump the SHAs here, rerun fetch-hal.sh, rerun the
# SITL tests, and say why in the commit message.
#
# repo<TAB>commit<TAB>source path in repo<TAB>destination under Drivers/

